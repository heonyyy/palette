    <script src="lib/jquery-3.7.1.min.js"></script>
    <script>
        $(function () {
            $(window).on('mousemove', function (e) {
                let x = e.pageX;
                let y = e.pageY;

                $('.cursor').css({
                    'top': y,
                    'left': x
                });
            });

            $('.header').on('mouseenter', function () {
                $('.header').addClass('active')
            }).on('mouseleave', function () {
                $('header').removeClass('active')
            })

            $('.nav .main-menu-01').on('mouseenter', function () {
                $('.m-01').addClass('active')
                $('header_bg').addClass('active')
            }).on('mouseleave', function () {
                $('.m-01').removeClass('active')
            });

            $('.nav .main-menu-02').on('mouseenter', function () {
                $('.m-02').addClass('active')
            }).on('mouseleave', function () {
                $('.m-02').removeClass('active')
            });

            $('.nav .main-menu-03').on('mouseenter', function () {
                $('.m-03').addClass('active')
            }).on('mouseleave', function () {
                $('.m-03').removeClass('active')
            });

            
            
        });
    </script>
</head>
